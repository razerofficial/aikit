[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-agent"
version = "0.1.0"
description = "OpenAI Realtime-compatible WebSocket server for voice interactions"
authors = [{ name = "Razer Inc." }]
license = { text = "Apache-2.0" }
requires-python = "~=3.12.0"
dependencies = [
    "websockets>=12.0",
    "openai>1.97.1",
    "numpy>=2.1.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4,<9",
    "pytest-asyncio>=0.24.0",
]
audio = [
    "pyaudio>=0.2.14",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
include = ["voice_agent"]
exclude = ["tests", "tests/**/*", "examples", "examples/**/*"]
