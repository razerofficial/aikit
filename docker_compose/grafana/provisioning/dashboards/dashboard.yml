# =============================================================================
# Grafana Dashboard Provisioning Configuration
# =============================================================================
# This file configures automatic dashboard loading for Grafana
# Dashboards placed in /var/lib/grafana/dashboards will be auto-loaded
# =============================================================================

apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards