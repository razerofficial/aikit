# =============================================================================
# Grafana Data Source Provisioning Configuration
# =============================================================================
# This file configures the Prometheus data source for Grafana
# The data source will be automatically configured on Grafana startup
# =============================================================================

apiVersion: 1

datasources:
  - name: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true
