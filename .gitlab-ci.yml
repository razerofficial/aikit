      # Save version tag for next job
      echo "VERSION_TAG=${VERSION_TAG}" > version.env
    - echo "Verifying attestations on Docker Hub..."
    - docker buildx imagetools inspect razerofficial/aikit:${VERSION_TAG}
  artifacts:
    reports:
      dotenv: version.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: manual
      allow_failure: true
  needs:
    - job: test
      optional: false
    - job: build-aikit
      optional: false

# Manual job to retag versioned image as latest
publish-latest:
  stage: publish
  tags: 
    - saas-linux-2xlarge-amd64
  image: docker:cli
  services:
    - docker:dind
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker buildx create --name latest-builder --driver docker-container --use
    - docker buildx inspect --bootstrap
  script:
    - |
      echo "Retagging razerofficial/aikit:${VERSION_TAG} as latest..."
      
      docker buildx imagetools create \
        --tag razerofficial/aikit:latest \
        razerofficial/aikit:${VERSION_TAG}
    - echo "Verifying latest tag on Docker Hub..."
    - docker buildx imagetools inspect razerofficial/aikit:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: manual
      allow_failure: true
  needs:
    - job: publish-dockerhub
      optional: false

include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
