      VERSION_TAG="cuda${CUDA_VERSION}-torch${TORCH_VERSION}-vllm${VLLM_VERSION}-aikit${AIKIT_VERSION}"
      
      echo "Detected versions:"
      echo "  CUDA: ${CUDA_VERSION}"
